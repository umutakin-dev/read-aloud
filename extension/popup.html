<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>Read Aloud</h1>

    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking server...</span>
    </div>

    <div class="section">
      <label for="voice-select">Voice</label>
      <select id="voice-select">
        <option value="af_heart">Heart (Female)</option>
      </select>
    </div>

    <div class="section">
      <label for="speed-input">Speed</label>
      <div class="speed-row">
        <input type="range" id="speed-input" min="0.5" max="3" step="0.1" value="1.0">
        <span id="speed-value">1.0x</span>
      </div>
    </div>

    <div class="section">
      <label for="server-url">Server URL</label>
      <input type="text" id="server-url" value="http://localhost:7860" spellcheck="false">
    </div>

    <div class="section">
      <label class="checkbox-row" for="allow-fallback">
        <input type="checkbox" id="allow-fallback">
        <span>
          Fall back to browser speech
          <small>Read with the browser's built-in voice when the Kokoro server
          is unavailable. Off means Read Aloud waits for the server instead.</small>
        </span>
      </label>
    </div>

    <button id="btn-save">Save Settings</button>

    <div class="shortcut-hint">
      Press <kbd>Ctrl+Shift+U</kbd> to toggle Read Aloud on any page
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
