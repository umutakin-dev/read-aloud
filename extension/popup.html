<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>Read Aloud</h1>

    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Checking server...</span>
    </div>

    <div class="section">
      <label for="engine-select">Engine</label>
      <select id="engine-select">
        <option value="auto">Automatic: the server if it's running, else this browser</option>
        <option value="browser">This browser (GPU, no install)</option>
        <option value="server">Local server only (exact word highlighting)</option>
      </select>
    </div>

    <div class="section">
      <label for="voice-select">Voice</label>
      <select id="voice-select">
        <option value="af_heart">Heart (Female)</option>
      </select>
    </div>

    <div class="section">
      <label for="speed-input">Speed</label>
      <div class="speed-row">
        <input type="range" id="speed-input" min="0.5" max="3" step="0.1" value="1.0">
        <span id="speed-value">1.0x</span>
      </div>
    </div>

    <div class="section">
      <label for="server-url">Server URL</label>
      <input type="text" id="server-url" value="http://localhost:7860" spellcheck="false">
    </div>

    <div class="section">
      <label class="checkbox-row" for="read-citations">
        <input type="checkbox" id="read-citations">
        <span>
          Read citation markers
          <small>Speak reference marks like [7] and [citation needed]. Off
          skips them. Applies from the next read.</small>
        </span>
      </label>
    </div>

    <div class="section">
      <label class="checkbox-row" for="allow-fallback">
        <input type="checkbox" id="allow-fallback">
        <span>
          Fall back to browser speech
          <small>Read with the browser's built-in voice when no Kokoro engine
          is available. Off means Read Aloud waits instead.</small>
        </span>
      </label>
    </div>

    <button id="btn-save">Save Settings</button>

    <!-- Filled from chrome.commands by popup.js: the bound key differs by
         platform and the user can rebind it (000050). -->
    <div class="shortcut-hint" id="shortcut-hint"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
