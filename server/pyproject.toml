[project]
name = "tts-server"
version = "0.1.0"
description = "Local Kokoro TTS server for Read Aloud Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    # Kokoro's grapheme-to-phoneme step needs this spacy model but does not
    # declare it — it shells out to `python -m pip install en_core_web_sm` the
    # first time it is missing. That fails in a uv-managed venv (no pip), and
    # `uv sync` prunes the model as an undeclared package, so it has to be a
    # real dependency. Not on PyPI; served from the spacy-models releases.
    "en-core-web-sm",
]

[dependency-groups]
# httpx is what starlette's TestClient drives; both are already present
# transitively, but the tests depend on them directly so they are named here.
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_server"]

# PyPI serves a CPU-only torch, so `uv sync` would leave Kokoro on the CPU even
# on a machine with a supported GPU. The CUDA build has to come from PyTorch's
# own index, and it is an install-time choice — there is no runtime switch.
#
# One wheel covers both cases: a CUDA build runs fine with no GPU present, it
# just reports cuda.is_available() == False, and the engine falls back to CPU.
#
# cu128 fully supports Ada Lovelace and needs a far older driver than any
# machine running this will have. macOS has no CUDA wheels, so it is excluded
# by the marker and keeps resolving from PyPI.
#
# For a deliberately CPU-only install:
#     uv sync --index pytorch-cpu=https://download.pytorch.org/whl/cpu
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
# Matches the installed spacy 3.8.x.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
