[project]
name = "tts-server"
version = "0.1.0"
description = "Local Kokoro TTS server for Read Aloud Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "kokoro>=0.9.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_server"]
